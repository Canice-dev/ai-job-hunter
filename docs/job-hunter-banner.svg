    <circle cx="795" cy="246" r="12" fill="#E9EEFF"/>
    <path d="M790 247h10M795 242v10" stroke="#526FD2" stroke-width="1.8" stroke-linecap="round"/>
    <text x="817" y="243" fill="#26334A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Prepare your application</text>
    <text x="817" y="258" fill="#7E8AA0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Tailored CV and cover letter</text>
    <rect x="771" y="282" width="95" height="19" rx="9.5" fill="#E8F8F5"/>
    <text x="786" y="295" fill="#168E7B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">STAY ON TRACK</text>
