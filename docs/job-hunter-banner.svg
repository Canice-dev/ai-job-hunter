  <text x="76" y="252" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-2">great role.</text>
  <text x="80" y="294" fill="#B9C5DA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Discover jobs. See your fit. Prepare with confidence.</text>

  <g filter="url(#shadow)">
    <rect x="744" y="83" width="365" height="232" rx="18" fill="#F8FAFD"/>
    <rect x="744" y="83" width="365" height="43" rx="18" fill="#FFFFFF"/>
    <path d="M744 108h365" stroke="#E6EBF2"/>
    <circle cx="766" cy="104" r="4" fill="#F28C85"/>
    <circle cx="781" cy="104" r="4" fill="#F4C66A"/>
    <circle cx="796" cy="104" r="4" fill="#72CDAE"/>
    <rect x="833" y="96" width="178" height="16" rx="8" fill="#F0F3F8"/>

    <text x="771" y="153" fill="#25324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">YOUR NEXT STEPS</text>
    <rect x="771" y="166" width="311" height="48" rx="11" fill="#FFFFFF" stroke="#E7ECF3"/>
    <circle cx="795" cy="190" r="12" fill="#DFF8F2"/>
    <path d="m790 190 3 3 6-7" stroke="#168E7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="817" y="187" fill="#26334A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Review a new opportunity</text>
    <text x="817" y="202" fill="#7E8AA0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Check the role, source, and fit</text>
